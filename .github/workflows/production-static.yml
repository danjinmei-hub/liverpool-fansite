name: Build production static site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The data bot uses GITHUB_TOKEN: its push does not trigger another push workflow.
  workflow_run:
    workflows: ["Update football data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-static-main
  cancel-in-progress: false

jobs:
  revision:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run.head_sha is the pre-update revision, not the bot's new commit.
          ref: main
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:football
      - run: npm run test:fotmob
      - name: Audit FotMob coverage (missing links warn only)
        run: npm run audit:fotmob
      - run: npm run build:static
      - run: npm run test:static
      - run: npm run test:release
      - name: Attach exact release manifest to the validated artifact
        env:
          RELEASE_SHA: ${{ needs.revision.outputs.source_sha }}
        run: node scripts/prepare-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: red-chorus-static-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  sites:
    needs: revision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Sites / Vinext build
        run: npm run build
      - name: Verify rendered Sites routes
        run: node --test tests/match-archive.test.mjs tests/homepage-freshness.test.mjs
      - name: Record Sites build target
        env:
          SOURCE_SHA: ${{ needs.revision.outputs.source_sha }}
        run: echo "Sites / Vinext build and route checks passed for ${SOURCE_SHA}. (Validation only; Sites publication is separate.)" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [revision, build, sites]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.source_sha }}
          persist-credentials: false
      - name: Skip publishing if a newer main revision exists
        env:
          BUILT_SHA: ${{ needs.revision.outputs.source_sha }}
        run: |
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$BUILT_SHA" != "$current_sha" ]]; then
            echo "A newer main revision is available; a later workflow will publish it." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: red-chorus-static-${{ github.run_id }}
          path: out/
      - name: Install pinned Alibaba Cloud ossutil
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            -o "$RUNNER_TEMP/ossutil.zip" \
            https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip
          echo "85edf66b2fb7238f5c7e25cab820cf29312319fe4935b7c86a6b8485eb434f3c  $RUNNER_TEMP/ossutil.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ossutil-2.4.0-linux-amd64" >> "$GITHUB_PATH"
      - name: Upload validated static site to Hong Kong OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: cn-hongkong
        run: bash scripts/deploy-oss-static.sh
      - name: Verify the public production release
        run: node scripts/verify-production.mjs
